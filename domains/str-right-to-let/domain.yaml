name: str-right-to-let
era_bounds:            # upper bound exclusive; last entry is the sentinel
  - {upper: 1860, label: pre-1860}
  - {upper: 1900, label: 1860-1900}
  - {upper: 1930, label: 1900-1930}
  - {upper: 1970, label: 1930-1970}
  - {upper: 10000, label: 1970-2020}
jurisdictions: [Tex., Pa., La., N.Y., Mass., Conn., N.J., Cal., Ohio, D.C.]
reporter_slugs: [f-cas, us, dc]          # federal tradition set (ADR-0008)
regions:
  Mass.: northeast
  Conn.: northeast
  N.Y.: northeast
  N.J.: northeast
  Pa.: northeast
  D.C.: mid-atlantic
  Ohio: midwest
  Tex.: south
  La.: south
  Cal.: west
  U.S.: federal
letting_tiers:                            # who_was_letting value -> tier
  householder: householder
  non_resident_owner: owner
  commercial_operator: commercial
  unclear: unclear
judged_fields: [relevant, polarity, who_was_letting, duration_of_occupancy,
                characterization, holding_summary, under_thirty_days,
                restriction_nature, owner_freedom_characterization]
curatorial_fields: [review.status, review.flags, review.notes, citator_status]
paths:
  selectors: selectors/selectors.yaml
  ontology: ontology/ontology.yaml
  prompts: prompts
  gold: data/gold/gold.jsonl
reviewer_default: mmaldo2
sharding:
  batch_size: 18
  min_seeds: 5
embedding:
  run_key: qwen3-4b-1024-int8
  model: Qwen/Qwen3-Embedding-4B
  revision: 5cf2132abc99cad020ac570b19d031efec650f2b            # pinned to a commit sha by tools/estimate_embed_cost.py --pin (Task 6)
  dim: 1024
  quant: int8-symmetric-pervector
  chunk_tokens: 400
  chunk_overlap: 40
  prefix_template: "{name} | {court} | {year}\n"
  hosted_provider: openrouter   # openrouter | deepinfra
  hosted_model_id: qwen/qwen3-embedding-4b
  hosted_usd_per_m_tokens: 0.02  # OpenRouter (DeepInfra) list price verified 2026-09-02; research doc said 0.01
ranking:
  default: classifier          # switched by tools/train_ranker.py (ship rule) and tools/measure_reranker.py (bar)
  classifier_version: v2               # user decision 2026-09-08 ("Ship v2"): D6 met vs fusion; v1 trailed only on a leaked slice
  fusion: {lexical_weight: 0.5, cosine_weight: 0.5}
  reranker:
    model: Qwen/Qwen3-Reranker-4B
    revision: 22e683669bc0f0bd69640a1354a6d0aebcfeede5             # replaced by tools/pin_reranker.py before any use; adapters refuse "main"
    query: >
      A judicial opinion about a householder, owner, or lessee letting rooms,
      lodgings, or a dwelling to lodgers, boarders, roomers, or short-term
      occupants, or about regulation of that practice.
  heldout: data/eval/ranker-heldout-v1.jsonl
  heldout_sha256: "d2d3dd74fb0eaac0015524fabcadd7cf94631e39e27cd490910bc3bd58ab5048"
  # Held-out v2 (slice 3, D3): human decisions only - human-reviewed relevant positives and
  # reviewer-overturned negatives - stratified by (era, jurisdiction, label) at ceil(25%).
  # Covers all ten jurisdictions, unlike v1's four. Frozen; v1 is never edited.
  heldout_v2: data/eval/ranker-heldout-v2.jsonl
  heldout_v2_sha256: "4146d442e3119862e3a9608804dfa0372d74ce2e657b5919f7bfa1786b3f8484"
  bar_ap_delta: 0.05
reader:
  codebooks_dir: codebooks
  codebook: mapper-v3
  judged_fields: [characterization, polarity, holding_summary, owner_freedom_characterization, restriction_nature, under_thirty_days]
  checker_sample_pct: 10
  families:
    anthropic/claude-sonnet-5: anthropic
    anthropic/claude-opus-5: anthropic
    anthropic/claude-haiku-4.5: anthropic
    google/gemini-3.7-flash: google
    openai/gpt-5.6-terra: openai
    claude-cli/claude-sonnet-5: anthropic
    claude-cli/claude-opus-5: anthropic
    deepseek/deepseek-v4-pro: deepseek
    z-ai/glm-5.3: zai
    minimax/minimax-m3: minimax
    deepseek/deepseek-v4-flash: deepseek
    qwen/qwen3.8-27b: qwen
    codex-cli: openai
  # kit v2 (2026-09-05): kit v1's same 195 cases rebuilt from the ledger after the user's two
  # reference-adjudication pages and the 4-of-5 model consensus. NOTE (Task 9a): `codebook` and
  # `kit_path` now name v3/v2, so measurement-v1's `--annotate-only` path is no longer
  # reproducible from these defaults - re-deriving v1's annotations means passing mapper-v2 and
  # data/reader/kit-v1/kit.json explicitly. kit-v1 itself is never edited.
  kit_path: data/reader/kit-v2/kit.json
  kit_sha256: "6914c0d243fec3a5f268788f3bd571a1c7bf19d5432c49dc805296184f65686d"  # written by tools/build_reader_kit.py
  stability_sample: data/reader/kit-v2/sample-50.json
  # Slice-1 finalists (spec section 8). The two claude-cli entries run on the user's
  # subscription through the Claude Code CLI (ADR-0007 amendment 2026-09-05); full model
  # names, never aliases, so the pin label is reproducible. `provider` selects the transport
  # and `cli_model` is the name the CLI is invoked with - the keys tools/measure_reader.py
  # reads (is_subscription / cli_pin).
  candidates:
    - {model_id: claude-cli/claude-sonnet-5, family: anthropic, provider: claude-cli, cli_model: claude-sonnet-5}
    - {model_id: claude-cli/claude-opus-5, family: anthropic, provider: claude-cli, cli_model: claude-opus-5}
    - {model_id: openai/gpt-5.6-terra, family: openai}
    - {model_id: z-ai/glm-5.3, family: zai, pin_open: true}
    - {model_id: google/gemini-3.7-flash, family: google}
  # measured 2026-09-05 by measurement v2 (reports/reader-measurement-v2.md, ADR-0007 result
  # note; manifest data/reader/measurement-v2/manifest.json) over kit v2 under mapper-v3.
  # RULE THAT FIRED: the SHORTFALL rule - no survivor reached the pre-registered 0.85 macro
  # agreement bar, so the highest-agreement survivor wins and the shortfall is disclosed.
  # Best macro 0.8363. The D4 subscription tie-break was evaluated and did NOT fire:
  # claude-cli/claude-opus-5 is 0.0243 behind, outside the 0.02 window. USER OVERRIDE
  # 2026-09-05 (ADR-0007): the pin is opus on the subscription, not the rule's gemini —
  # tied on relevance (0.90 vs 0.91), 168 vs 149 fully judged records, repeat-read
  # consistency (gemini re-decided only 72% of the sample's polarity/who answers),
  # zero marginal cost. gemini-3.7-flash stays the screening/fallback provider
  # (reasoning effort low, openrouter-routed) for slice 2's deep-tail relevance pass.
  # The rule's selection is preserved in data/reader/measurement-v2/manifest.json.
  model: {model_id: claude-cli/claude-opus-5, family: anthropic, provider: claude-cli, cli_model: claude-opus-5, effort: low}
  fallback_model: {model_id: google/gemini-3.7-flash, family: google, provider_name: null, precision: null, extra: {reasoning: {effort: low}}}
  checker: {model_id: codex-cli, family: openai, cli_model: gpt-5.6-terra}
citation_preference:   # reporter abbreviations as CAP spells them, official reports first (answers spec section 3)
  N.Y.: [N.Y., N.Y.2d, N.Y.3d, Johns., Wend., A.D., App. Div., A.D.2d, A.D.3d, Misc., Misc. Rep., Misc. 2d, Misc. 3d, N.Y. Sup. Ct., Barb., Hun., N.Y. Super. Ct., Jones & S., How. Pr., Abb. Pr., Daly (N.Y.), Mills Surr., N.E., N.E.2d, N.Y.S., N.Y.S.2d, N.Y.S.3d, N.Y. St. Rep., N.Y. Crim.]
  Tex.: [Tex., Tex. Crim., Tex. Cr. R., Tex. Civ. App., Tex. Ct. App., Dallam, Posey, White & W., Willson, Wilson, Robards, S.W., S.W.2d, S.W.3d]
  Ohio: [Ohio, Ohio St., Ohio St. 2d, Ohio St. 3d, Wright, Ohio App., Ohio App. 2d, Ohio App. 3d, Ohio C.C., Ohio C.C. (n.s.), Ohio C.C. (N.S.), Ohio Cir. Dec., Ohio C.C. Dec., Ohio C.A., Ohio N.P., Ohio N.P. (n.s.), Ohio Misc., Ohio Misc. 2d, Ohio Law Abs., Ohio L. Abs., Abs., N.E., N.E.2d]
  Pa.: [Pa., Dall., Yeates, Binn., Serg. & Rawle, Rawle, Pen. & W., Watts, Watts & Serg., Whart., Pa. Super., Pa. Super. Ct., Pa. Commw., Pa. D. & C., Pa. D. & C.2d, Pa. D. & C.3d, Pa. D. & C.4th, Pa. D. & C.5th, A., A.2d, A.3d]
  Mass.: [Mass., Tyng, Pick., Met., Cush., Gray, Allen, Mass. App. Ct., Mass. App. Div., Mass. App. Dec., Mass. Supp., Mass. L. Rptr., N.E., N.E.2d]
  Conn.: [Conn., Root, Kirby, Day, Conn. App., Conn. Supp., Conn. Cir. Ct., A., A.2d]
  N.J.: [N.J., N.J.L., N.J. Eq., N.J. Super., N.J. Misc., N.J. Tax, N.J. Tax., A., A.2d, A.3d]
  Cal.: [Cal., Cal. 2d, Cal. 3d, Cal. 4th, Cal. 5th, Cal. App., Cal. App. 2d, Cal. App. 3d, Cal. App. 4th, Cal. App. 5th, Cal. App. 2d Supp., Cal. App. 3d Supp., Cal. App. 4th Supp., Cal. Unrep., Pac., P., P.2d, P.3d, Cal. Rptr., Cal. Rptr. 2d, Cal. Rptr. 3d]
  La.: [La., La. Ann., Mart., Mart. (o.s.), Mart. (n.s.), Rob., La. App., Teiss., Pelt., So., So. 2d, So.2d, So. 3d, So.3d]
  D.C.: [U.S. App. D.C., App. D.C., D.C., Mackey, MacArth., MacArth. & M., Hay. & Haz., D.C. App., F.2d, F.3d, A.2d, A.3d]
  U.S.: [U.S., Dall., Cranch, Wheat., Pet., How., Black, Wall., S. Ct., L. Ed., L. Ed. 2d, F. Cas., F., F.2d]
